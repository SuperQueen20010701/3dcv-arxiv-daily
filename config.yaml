# TODO: add papers by configuration file
base_url: "https://arxiv.paperswithcode.com/api/v0/papers/"
user_name: "SuperQueen20010701"
repo_name: "3dv-arxiv-daily"
show_authors: True
show_links: True
show_badge: True
max_results: 10

publish_readme: True
publish_gitpage: True
publish_wechat: False

# file paths
json_readme_path: './docs/3dv-arxiv-daily.json'
json_gitpage_path: './docs/3dv-arxiv-daily-web.json'
json_wechat_path: './docs/3dv-arxiv-daily-wechat.json'

md_readme_path: 'README.md'
md_gitpage_path: './docs/index.md'
md_wechat_path: './docs/wechat.md'

# keywords to search
keywords:
    "3D Reconstruction":
        filters: ["SFM", "Structure from Motion", "Structure and Motion",
                  "3D Reconstruction", "Scene Reconstruction", "3D Geometric",
                  "VGGT"]
        titles: ["ti:SFM", "ti:Structure from Motion", "ti:Structure and Motion",
                  "ti:Reconstruction", "ti:Scene Reconstruction", "ti:3D",
                  "ti:VGGT"]
        categories: ["cat:cs.CV", "cat:cs.GR", "cat:cs.RO"]
        invert: ["ti:NeRF", "ti:Neural Radiance Field", "ti:Gaussian Splatting", "ti:NGP",
                 "ti:GS", "ti:Neural Fields", "abs:GS", "abs:Gaussian Splatting",
                 "ti:Generative", "ti:Diff", "ti:Generation",
                 "ti:Medical", "ti:Surgery", "ti:Surgical", "ti:MRI", "ti:Endoscopic",
                 "ti:X-ray", "ti:PET", "ti:CT", "ti:CBCT", "ti:Ultrasound",
                 "ti:Tomography", "ti:Bronchoscopy", "ti:EEG", "ti:Brain",
                 "abs:Medical", "abs:Surgery", "abs:Surgical", "abs:MRI", "abs:Endoscopic",
                 "abs:X-ray", "abs:PET", "abs:CT", "abs:CBCT", "abs:Ultrasound",
                 "abs:Tomography", "abs:Bronchoscopy", "abs:EEG", "abs:Brain"]
    "Depth Estimation":
        filters: ["Depth Estimation", "Monocular Depth Estimation",
                  "Metric Depth", "Geometry Estimation"]
        titles: ["ti:Depth", "ti:Monocular", "ti:Metric", "ti:Geometr", "ti:Single"]
        categories: ["cat:cs.CV", "cat:cs.GR", "cat:cs.RO"]
        invert: ["ti:NeRF", "ti:Neural Radiance Field", "ti:Gaussian Splatting", "ti:NGP",
                 "ti:Medical", "ti:Surgery", "ti:MRI", "ti:Reconstruction"]
    "Visual Localization":
        filters: ["Visual Localization","Camera Localization",
                  "Camera Relocalization", "Visual Place Recognition",
                  "Image Retrieval", "SLAM"]
        titles: ["ti:Localization", "ti:Place Recognition", "ti:localisation","ti:Retrieval",
                 "ti:APR", "ti:Dof", "ti:Pose Estimation", "ti:Pose Regression", "ti:Coordinate",
                 "ti:SLAM"]
        categories: ["cat:cs.CV", "cat:cs.GR", "cat:cs.RO"]
        invert: ["ti:Medical", "ti:Object Pose"]
    "Image Matching":
        filters: ["Image Matching"]
        categories: ["cat:cs.CV", "cat:cs.GR", "cat:cs.RO"]
        invert: ["ti:Medical", "ti:Surgery", "ti:MRI"]
    "NeRF & Gaussian":
        filters: ["NeRF", "Neural Radiance Field", "Gaussian Splatting"]
        titles: ["ti:NeRF", "ti:Radiance", "ti:Field", "ti:Gaussian",
                 "ti:Splatting"]
        categories: ["cat:cs.CV", "cat:cs.GR", "cat:cs.RO"]
    "Object Detection & Segmentation":
        filters: ["Robotic Object Detection", "Robot Object Detection",
                  "Object Detection for Robots", "Object Detection for Robot Manipulation",
                  "Object Detection for Robotic Manipulation",
                  "Object Detection for Grasping",
                  "Embodied Object Detection",
                  "Robotic Object Segmentation", "Object Segmentation for Robots",
                  "Object Segmentation for Robot Manipulation",
                  "Robotic Instance Segmentation",
                  "Instance Segmentation for Robotic Manipulation",
                  "Instance Segmentation for Grasping",
                  "Robotic Semantic Segmentation",
                  "Semantic Segmentation for Robotics",
                  "Robotic Panoptic Segmentation",
                  "Part Segmentation for Robotic Manipulation",
                  "3D Instance Segmentation for Grasping",
                  "Language-Grounded Segmentation for Grasping",
                  "Open-Vocabulary Detection for Robots",
                  "Open-Vocabulary Segmentation for Robots"]
    
        titles: ["ti:Robotic Object Detection", "ti:Robot Object Detection",
                 "ti:Object Detection for Robots",
                 "ti:Object Detection for Robot Manipulation",
                 "ti:Object Detection for Grasping",
                 "ti:Embodied Object Detection",
                 "ti:Robotic Object Segmentation",
                 "ti:Object Segmentation for Robots",
                 "ti:Robotic Instance Segmentation",
                 "ti:Instance Segmentation for Manipulation",
                 "ti:Instance Segmentation for Grasping",
                 "ti:Robotic Semantic Segmentation",
                 "ti:Semantic Segmentation for Robotics",
                 "ti:Robotic Panoptic Segmentation",
                 "ti:Part Segmentation for Manipulation",
                 "ti:3D Instance Segmentation for Grasping",
                 "ti:Segmentation for Robotic Manipulation",
                 "ti:Segmentation for Language-Grounded Grasping",
                 "ti:Open-Vocabulary Detection for Robots",
                 "ti:Open-Vocabulary Segmentation for Robots"]
    
        categories: ["cat:cs.RO", "cat:cs.CV", "cat:cs.AI"]
    
        invert: ["ti:Autonomous Driving", "ti:Medical", "ti:Surgical",
                 "ti:Remote Sensing", "ti:Satellite",
                 "ti:Anomaly Detection", "ti:SLAM", "ti:Visual Odometry"]
